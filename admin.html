 <script>
 let settings = {
 storeName: 'PRETHUSKA',
 storeSubtitle: 'acessórios e makeup',
 whatsapp: '5519994604562',
 deliveryFee: 8.00,
 storeAddress: 'Retirada combinada pelo WhatsApp após confirmação',
 instagramUrl: 'https://www.instagram.com/prethuskaacessorios',
 adminPin: '1234',
 birthdayTemplate: 'Olá {nome}! 🎂💖 Aqui é da PRETHUSKA Acessórios e Makeup! Passando para desejar um Feliz Aniversário cheio de beleza! Preparamos um mimo especial para você hoje ✨'
 };

 const DEFAULT_PRODUCTS = [{
 id: 'prod_1',
 name: 'Kit Laços Luxo Mãe & Filha Veludo Rosé',
 price: 45.90,
 oldPrice: 59.90,
 category: 'Kits Mãe & Filha',
 variants: ['Rosé Malva', 'Champanhe Dourado'],
 desc: 'Par de laços artesanais feitos à mão com acabamento antideslizante.',
 images: ['https://placehold.co/400x400/F7ECEA/A47873?text=Prethuska+1'],
 outOfStock: false
 }];

 let products = [];
 let customersCRM = [];
 let adminUploadedPhotos = [];

 window.onFirebaseReady = async () => {
 initAdminRealtimeListeners();
 };

 function initAdminRealtimeListeners() {
 const db = window.db;
 const docRef = window.firebaseDoc;
 const coll = window.firebaseColl;
 const onSnapshot = window.firebaseOnSnapshot;
 const setDoc = window.firebaseSetDoc;

 onSnapshot(docRef(db, "config", "main"), (docSnap) => {
 if (docSnap.exists() && docSnap.data().dados) {
 settings = docSnap.data().dados;
 loadSettingsForm();
 }
 }, (err) => { console.error(err); });

 onSnapshot(coll(db, "produtos"), async (querySnapshot) => {
 if (!querySnapshot.empty) {
 products = querySnapshot.docs.map(d => d.data().dados);
 } else {
 products = DEFAULT_PRODUCTS;
 for (const p of products) {
 await setDoc(docRef(db, "produtos", p.id), { dados: p });
 }
 }
 renderAdminProducts();
 }, (err) => { console.error(err); });

 onSnapshot(coll(db, "clientes"), (querySnapshot) => {
 if (!querySnapshot.empty) {
 customersCRM = querySnapshot.docs.map(d => d.data().dados);
 }
 renderAdminBirthdays();
 }, (err) => { console.error(err); });
 }

 function verifyAdminPin() {
 const pinInput = document.getElementById('admin-pin-input').value;
 if (pinInput === settings.adminPin) {
 document.getElementById('admin-login-screen').classList.add('hidden');
 document.getElementById('admin-panel').classList.remove('hidden');
 resetProductForm();
 renderAdminProducts();
 renderAdminBirthdays();
 loadSettingsForm();
 } else {
 showToast('PIN incorreto!', 'error');
 }
 }

 function showToast(message, type = 'success') {
 const container = document.getElementById('toast-container');
 const toast = document.createElement('div');
 toast.className = `${type === 'error' ? 'bg-rose-600' : 'bg-mauve-900'} text-white px-4 py-3 rounded-2xl shadow-lg text-xs font-semibold flex items-center gap-2.5 animate-fade-in border border-white/10`;
 toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check text-gold-400'} text-sm"></i><span>${message}</span>`;
 container.appendChild(toast);
 setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 250); }, 3000);
 }

 function switchAdminTab(tab) {
 ['products', 'birthdays', 'settings'].forEach(t => {
 document.getElementById(`admin-tab-${t}`).classList.add('hidden');
 document.getElementById(`tab-btn-${t}`).className = 'px-4 py-2 rounded-xl bg-white/10 text-mauve-200 text-xs font-bold whitespace-nowrap cursor-pointer';
 });
 document.getElementById(`admin-tab-${tab}`).classList.remove('hidden');
 document.getElementById(`tab-btn-${tab}`).className = 'px-4 py-2 rounded-xl bg-mauve-500 text-white text-xs font-bold whitespace-nowrap cursor-pointer';
 }

 async function handleMultipleImagesUpload(event) {
 const files = Array.from(event.target.files);
 for (const file of files) {
 if (adminUploadedPhotos.length >= 5) break;
 const compressed = await compressImageFile(file, 800, 0.75);
 adminUploadedPhotos.push(compressed);
 }
 renderAdminPhotosPreview();
 }

 function compressImageFile(file, maxDim, quality) {
 return new Promise((resolve) => {
 const reader = new FileReader();
 reader.onload = e => {
 const img = new Image();
 img.onload = () => {
 let w = img.width, h = img.height;
 if (w > maxDim || h > maxDim) { if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; } else { w = Math.round((w * maxDim) / h); h = maxDim; } }
 const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
 canvas.getContext('2d').drawImage(img, 0, 0, w, h);
 resolve(canvas.toDataURL('image/jpeg', quality));
 };
 img.src = e.target.result;
 };
 reader.readAsDataURL(file);
 });
 }

 function renderAdminPhotosPreview() {
 document.getElementById('admin-photo-counter').textContent = `${adminUploadedPhotos.length} / 5`;
 document.getElementById('admin-photos-preview-grid').innerHTML = adminUploadedPhotos.map((src, i) => `
 <div class="relative aspect-square rounded-xl overflow-hidden border-2 ${i === 0 ? 'border-gold-500' : 'border-mauve-200'} bg-mauve-50">
 <img src="${src}" class="w-full h-full object-cover">
 <button type="button" onclick="adminUploadedPhotos.splice(${i},1);renderAdminPhotosPreview();" class="absolute top-1 right-1 w-5 h-5 rounded-full bg-rose-600 text-white text-[10px] flex items-center justify-center cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
 </div>`).join('');
 }

 async function saveProduct() {
 const id = document.getElementById('edit-prod-id').value || 'prod_' + Date.now();
 const name = document.getElementById('prod-name').value.trim();
 const price = parseFloat(document.getElementById('prod-price').value);
 if (!name || isNaN(price) || adminUploadedPhotos.length === 0) { showToast('Preencha Nome, Preço e adicione foto.', 'error'); return; }
 
 const saveBtn = document.getElementById('save-prod-btn');
 saveBtn.disabled = true;
 saveBtn.textContent = 'Salvando no Firebase...';

 const product = {
 id, name, price,
 oldPrice: parseFloat(document.getElementById('prod-old-price').value) || null,
 category: document.getElementById('prod-category').value,
 variants: document.getElementById('prod-variants').value.split(',').map(v => v.trim()).filter(Boolean),
 desc: document.getElementById('prod-desc').value.trim(),
 images: [...adminUploadedPhotos],
 outOfStock: document.getElementById('prod-status').value === 'out'
 };

 try {
 const db = window.db;
 const docRef = window.firebaseDoc;
 const setDoc = window.firebaseSetDoc;
 await setDoc(docRef(db, "produtos", id), { dados: product });

 const idx = products.findIndex(p => p.id === id);
 if (idx > -1) products[idx] = product; else products.unshift(product);
 
 resetProductForm();
 renderAdminProducts();
 showToast('Produto salvo e sincronizado com sucesso!');
 } catch (err) {
 console.error(err);
 showToast('Erro ao salvar no Firebase.', 'error');
 } finally {
 saveBtn.disabled = false;
 saveBtn.textContent = 'Publicar no Firebase';
 }
 }

 function editProduct(id) {
 const p = products.find(item => item.id === id);
 if (!p) return;
 document.getElementById('edit-prod-id').value = p.id;
 document.getElementById('prod-name').value = p.name;
 document.getElementById('prod-price').value = p.price;
 document.getElementById('prod-old-price').value = p.oldPrice || '';
 document.getElementById('prod-category').value = p.category;
 document.getElementById('prod-status').value = p.outOfStock ? 'out' : 'available';
 document.getElementById('prod-variants').value = p.variants?.join(', ') || '';
 document.getElementById('prod-desc').value = p.desc || '';
 adminUploadedPhotos = p.images ? [...p.images] : [];
 renderAdminPhotosPreview();
 }

 function resetProductForm() {
 document.getElementById('edit-prod-id').value = '';
 document.getElementById('prod-name').value = '';
 document.getElementById('prod-price').value = '';
 document.getElementById('prod-old-price').value = '';
 document.getElementById('prod-variants').value = '';
 document.getElementById('prod-desc').value = '';
 adminUploadedPhotos = [];
 renderAdminPhotosPreview();
 }

 async function deleteProduct(id) {
 try {
 const db = window.db;
 const docRef = window.firebaseDoc;
 const deleteDoc = window.firebaseDeleteDoc;
 await deleteDoc(docRef(db, "produtos", id));
 products = products.filter(p => p.id !== id);
 renderAdminProducts();
 showToast('Produto excluído!');
 } catch(err) {
 console.error(err);
 showToast('Erro ao excluir produto.', 'error');
 }
 }

 function formatCurrency(val) { return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }

 function renderAdminProducts() {
 document.getElementById('admin-products-list').innerHTML = products.map(p => `
 <div class="bg-white p-3.5 rounded-2xl border border-mauve-200/80 flex items-center gap-3.5">
 <img src="${p.images?.[0] || ''}" class="w-16 h-16 rounded-xl object-cover shrink-0 bg-mauve-100">
 <div class="flex-1 min-w-0">
 <h4 class="font-bold text-sm text-mauve-900 truncate">${p.name}</h4>
 <p class="text-xs font-bold text-mauve-600">${formatCurrency(p.price)}</p>
 </div>
 <div class="flex gap-1.5">
 <button type="button" onclick="editProduct('${p.id}')" class="p-2 rounded-lg bg-mauve-100 cursor-pointer"><i class="fa-solid fa-pen"></i></button>
 <button type="button" onclick="deleteProduct('${p.id}')" class="p-2 rounded-lg bg-rose-50 text-rose-600 cursor-pointer"><i class="fa-solid fa-trash"></i></button>
 </div>
 </div>`).join('');
 }

 async function registerCustomerInCloud(name, phone, birthday) {
 const clean = phone.replace(/\D/g, '');
 const clientData = { id: clean, name, phone, birthday };
 const db = window.db;
 const docRef = window.firebaseDoc;
 const setDoc = window.firebaseSetDoc;
 await setDoc(docRef(db, "clientes", clean), { dados: clientData });
 }

 async function addManualCustomer() {
 const name = document.getElementById('manual-cust-name').value.trim();
 const phone = document.getElementById('manual-cust-phone').value.trim();
 const bday = document.getElementById('manual-cust-bday').value.trim();
 if (!name || !phone || bday.length < 10) return;
 await registerCustomerInCloud(name, phone, bday);
 document.getElementById('manual-cust-name').value = '';
 document.getElementById('manual-cust-phone').value = '';
 document.getElementById('manual-cust-bday').value = '';
 showToast('Cliente cadastrado com sucesso!');
 }

 function maskPhone(input) {
 let v = input.value.replace(/\D/g, '').slice(0, 11);
 if (v.length > 6) input.value = `(${v.slice(0, 2)}) ${v.slice(2, 7)}-${v.slice(7)}`;
 else if (v.length > 2) input.value = `(${v.slice(0, 2)}) ${v.slice(2)}`;
 else if (v.length > 0) input.value = `(${v}`;
 }

 function maskDate(input) {
 let v = input.value.replace(/\D/g, '').slice(0, 8);
 if (v.length > 4) input.value = `${v.slice(0, 2)}/${v.slice(2, 4)}/${v.slice(4)}`;
 else if (v.length > 2) input.value = `${v.slice(0, 2)}/${v.slice(2)}`;
 else input.value = v;
 }

// Web Audio API sound generator with multiple alert options
function playSelectedSound() {
  const soundType = document.getElementById('sound-selector')?.value || 'buzina';
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    if (soundType === 'buzina') {
      // Air horn / Loud buzzer (Dual sawtooth oscillators)
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc1.type = 'sawtooth';
      osc1.frequency.setValueAtTime(233.08, audioCtx.currentTime); // Bb3
      osc2.type = 'sawtooth';
      osc2.frequency.setValueAtTime(311.13, audioCtx.currentTime); // Eb4
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
      
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc1.start();
      osc2.start();
      osc1.stop(audioCtx.currentTime + 0.8);
      osc2.stop(audioCtx.currentTime + 0.8);
      
    } else if (soundType === 'sino') {
      // Hotel bell (High chime with decay)
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1760, audioCtx.currentTime); // A6
      
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
      
    } else if (soundType === 'campainha') {
      // Doorbell (Ding-dong two-tone)
      const now = audioCtx.currentTime;
      [659.25, 523.25].forEach((freq, i) => { // E5 then C5
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.3);
        gain.gain.setValueAtTime(0.3, now + i * 0.3);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.3 + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.3);
        osc.stop(now + i * 0.3 + 0.5);
      });
      
    } else if (soundType === 'digital') {
      // Sci-fi digital pulse
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
      
    } else {
      // Short beep
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }
  } catch(e) {
    console.error("Audio error:", e);
  }
}
